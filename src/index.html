<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="referrer" content="strict-origin-when-cross-origin" />
        <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
        <meta
            name="description"
            content="Plan routes for railways on their tracks using the OpenRailRouting engine and OpenStreetMap data"
        />
        <meta
            name="keywords"
            content="openrailrouting,openstreetmap,osm,shortest path"
        />
        <link rel="manifest" href="./manifest.json" />
        <!-- config.js is not included in bundle.js -->
        <script src="config.js"></script>
        <title>OpenRailRouting Route Planner</title>
        <style>
            html,
            body {
                overscroll-behavior: none;
                height: 100%;
                width: 100%;
                margin: 0;
                padding: 0;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }

            body {
                min-height: 100%;
            }

            @media (min-resolution: 2dppx) and (min-height: 700px) {
                html {
                    font-size: 118%;
                }
            }

            ul {
                list-style-type: none;
                margin: 0;
                padding: 0;
            }

            svg {
                display: block;
                color: inherit;
            }
        </style>
    </head>
    <body></body>
</html>
